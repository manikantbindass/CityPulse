<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc"><title id="title">CityPulse — build with evidence</title><desc id="desc">Subtle upward light particles surround a static invitation to contribute.</desc><defs><linearGradient id="bg"><stop stop-color="#080d1c"/><stop offset="1" stop-color="#19143d"/></linearGradient><linearGradient id="line"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1200" height="210" rx="24" fill="url(#bg)"/><path d="M0 65Q300 10 600 65T1200 65" fill="none" stroke="url(#line)" opacity=".45"/><g fill="#67e8f9" class="light"><circle cx="100" cy="160" r="2"/><circle cx="1050" cy="150" r="3"/><circle cx="1140" cy="180" r="2"/></g><g fill="#a78bfa" class="light second"><circle cx="165" cy="170" r="3"/><circle cx="960" cy="170" r="2"/></g><text x="600" y="115" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#e2e8f0">Better decisions begin with better evidence.</text><text x="600" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3" fill="#a5b4fc">EXPLORE THE CODE · TEST THE ASSUMPTIONS · BUILD CITYPULSE</text></svg>