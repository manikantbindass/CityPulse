<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="t"><title id="t">Observe, anticipate, verify: the CityPulse narrative</title><style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style><rect width="1200" height="150" rx="18" fill="#0b1221"/><path d="M190 75H1010" stroke="#37475e" fill="none"/><path class="motion" d="M190 75H1010" stroke="#67e8f9" stroke-dasharray="14 42" fill="none"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3s" repeatCount="indefinite"/></path><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#18283c" stroke="#6c9fbb"><circle cx="190" cy="75" r="25"/><circle cx="600" cy="75" r="25"/><circle cx="1010" cy="75" r="25"/></g><g fill="#d4e6fc" font-size="15"><text x="190" y="81">01</text><text x="600" y="81">02</text><text x="1010" y="81">03</text></g><g fill="#a7b8d1" font-size="13"><text x="190" y="128">OBSERVE / SPATIAL CONTEXT</text><text x="600" y="128">ANTICIPATE / BASELINE FORECAST</text><text x="1010" y="128">VERIFY / TRACEABLE EVIDENCE</text></g></g></svg>