receivers:
  otlp:
    protocols:
      http: { endpoint: '0.0.0.0:4318' }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 128 }
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version"])
      - context: span
        statements:
          - keep_keys(attributes, ["http.route", "http.request.method", "http.response.status_code", "error.type"])
          - set(status.message, "")
          - set(name, "citypulse.span")
          - set(name, attributes["http.route"]) where attributes["http.route"] != nil
      - context: spanevent
        statements:
          - keep_keys(attributes, ["exception.type"])
  batch: { timeout: 1s, send_batch_size: 256 }
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
extensions:
  health_check: { endpoint: '0.0.0.0:13133' }
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/redact, batch]
      exporters: [otlp/tempo]
