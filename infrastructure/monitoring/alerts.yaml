groups:
  - name: citypulse
    rules:
      - alert: CityPulseTargetDown
        expr: up{job=~"api|ai"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          {
            summary: 'Scrape target unavailable; check process, auth and network before declaring outage',
          }
      - alert: CityPulseAiErrors
        expr: sum(rate(citypulse_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(citypulse_http_requests_total[5m])), 0.001) > 0.01
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'AI 5xx rate above proposed 1% threshold' }
      - alert: CityPulseApiErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.01
        for: 5m
        labels: { severity: warning }
        annotations: { summary: 'API 5xx rate above proposed 1% threshold' }
      - alert: CityPulseAiLatency
        expr: histogram_quantile(0.95, sum by(le) (rate(citypulse_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations: { summary: 'AI p95 latency above two seconds' }
      - alert: CityPulseIngestionFailed
        expr: citypulse_ingestion_last_run_failed == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          {
            summary: 'Instrumented operator ingestion failed; inspect checkpoint/dead-letter report',
          }
