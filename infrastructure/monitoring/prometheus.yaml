global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['api:9091'] }]
  - job_name: ai
    metrics_path: /metrics
    static_configs: [{ targets: ['ai:8000'] }]
  - job_name: ingestion
    honor_labels: true
    static_configs: [{ targets: ['pushgateway:9091'] }]
