[project]
name = "citypulse-ai"
version = "0.1.0"
description = "Validated baseline forecasting for CityPulse"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.41.0",
  "scikit-learn==1.8.0",
  "numpy==2.4.2",
  "xgboost==3.4.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.15.4"]

[build-system]
requires = ["setuptools==82.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["citypulse_ai*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
