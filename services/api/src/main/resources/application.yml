spring:
  application:
    name: citypulse-api
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  swagger-ui:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/local
citypulse:
  local-token: ${LOCAL_API_TOKEN}
---
spring:
  config:
    activate:
      on-profile: '!local'
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
