name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm test --workspace apps/web
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace apps/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-test-results
          path: |
            apps/web/test-results
            docs/assets/workspace-*.png
          if-no-files-found: ignore
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f services/api/pom.xml verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: java-test-results
          path: services/api/target/surefire-reports
  ai-and-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r services/ai-engine/requirements-dev.lock
      - run: pip install --no-deps -e services/ai-engine
      - run: python -m pytest services/ai-engine/tests && ruff check services/ai-engine
      - run: python scripts/check_repository.py && python scripts/check_readme.py && python scripts/check_secrets.py
      - run: python -m unittest discover -s services/ingestion/tests -v
      - run: python scripts/train_models.py --data data/sample/ml/daily-segments.json --out .build/release-models --report .build/release-model-evaluation.json
      - run: npm ci && npm run format:check
      - run: python scripts/setup-env.py && docker compose config --quiet
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run test:contracts
      - run: npm run lint --workspace blockchain
      - run: npm run demo:ephemeral --workspace blockchain
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/setup-env.py
      - run: docker compose -f compose.yaml -f infrastructure/monitoring/compose.yaml --profile chain up --build -d --wait --wait-timeout 300
      - run: python scripts/smoke.py && python scripts/check_database_privileges.py
      - run: python scripts/data_pipeline.py demo && python scripts/data_pipeline.py publish
      - run: python scripts/monitoring_smoke.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/release_journey.py
      - run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - shell: python
        run: |
          import os, pathlib, subprocess
          values = dict(line.split('=', 1) for line in pathlib.Path('.env').read_text().splitlines() if '=' in line and not line.startswith('#'))
          os.environ['LOCAL_API_TOKEN'] = values['LOCAL_API_TOKEN']
          subprocess.run(['npm', 'run', 'test:e2e', '--workspace', 'apps/web', '--', 'e2e/release.spec.ts'], check=True)
        env:
          CITYPULSE_FULL_STACK: 'true'
          PULSEAI_LOCAL_PREVIEW: 'true'
          API_BASE_URL: http://127.0.0.1:8080
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-journey
          path: |
            .build/release-journey/
            apps/web/test-results/
      - run: docker compose -f compose.yaml -f infrastructure/monitoring/compose.yaml --profile chain logs --no-color
        if: failure()
      - run: docker compose -f compose.yaml -f infrastructure/monitoring/compose.yaml --profile chain down
        if: always()
