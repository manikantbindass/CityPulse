name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm test --workspace apps/web
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: |
            apps/web/test-results
            docs/assets/workspace-*.png
          if-no-files-found: ignore
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f services/api/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-results
          path: services/api/target/surefire-reports
  ai-and-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r services/ai-engine/requirements-dev.lock
      - run: pip install --no-deps -e services/ai-engine
      - run: python -m pytest services/ai-engine/tests && ruff check services/ai-engine
      - run: python scripts/check_repository.py && python scripts/check_secrets.py
      - run: python -m unittest discover -s services/ingestion/tests -v
      - run: npm ci && npm run format:check
      - run: python scripts/setup-env.py && docker compose config --quiet
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run test:contracts
