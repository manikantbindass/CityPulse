name: Synthetic model evaluation
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r services/ai-engine/requirements-dev.lock
      - run: pip install --no-deps -e services/ai-engine
      - run: python scripts/train_models.py
      - run: python -m pytest services/ai-engine/tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-model-evaluation
          include-hidden-files: true
          path: |
            .models
            docs/reports/model-evaluation.json
          retention-days: 14
