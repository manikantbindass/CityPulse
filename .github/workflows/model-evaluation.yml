name: Synthetic model evaluation
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/ai-engine/requirements-dev.lock
      - run: pip install --no-deps -e services/ai-engine
      - run: python scripts/train_models.py
      - run: python -m pytest services/ai-engine/tests
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-model-evaluation
          include-hidden-files: true
          path: |
            .models
            docs/reports/model-evaluation.json
          retention-days: 14
