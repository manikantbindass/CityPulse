name: Synthetic model evaluation
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r services/ai-engine/requirements-dev.lock
      - run: pip install --no-deps -e services/ai-engine
      - run: python scripts/train_models.py
      - run: python -m pytest services/ai-engine/tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-model-evaluation
          include-hidden-files: true
          path: |
            .models
            docs/reports/model-evaluation.json
          retention-days: 14
