name: Documents
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/reports/source/requirements.txt -r docs/presentations/source/requirements.txt
      - run: python scripts/check_documents.py
      - run: python scripts/test_documents.py
      - run: python scripts/build-report.py && python scripts/build-presentation.py
      - run: python scripts/check_documents.py && python scripts/check_repository.py && python scripts/check_readme.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regenerated-documents
          path: |
            docs/reports/CityPulse-Technical-Report.pdf
            docs/presentations/CityPulse-Project-Presentation.pptx
