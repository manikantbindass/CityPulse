name: Security
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-and-secret-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm audit --omit=dev --audit-level=high
      - run: pip install pip-audit && pip-audit -r services/ai-engine/requirements.lock
      - run: python scripts/check_secrets.py
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,python,java-kotlin
      - run: mvn -B -ntp -f services/api/pom.xml package -DskipTests
      - uses: github/codeql-action/analyze@v3
