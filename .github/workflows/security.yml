name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-and-secret-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Record developer dependency advisories (review required)
        run: npm audit --json > security-developer-dependencies.json || test -s security-developer-dependencies.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: developer-dependency-advisories
          path: security-developer-dependencies.json
      - run: pip install pip-audit && pip-audit -r services/ai-engine/requirements.lock
      - run: python scripts/check_secrets.py
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b
        with:
          languages: javascript-typescript,python,java-kotlin
      - run: mvn -B -ntp -f services/api/pom.xml package -DskipTests
      - uses: github/codeql-action/analyze@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b

  container-and-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          cache: true
          version: v0.76.1
      - name: Scan tracked source for secrets
        run: trivy fs --offline-scan --scanners secret --exit-code 1 --skip-dirs .git,node_modules,.venv .
      - name: Record configuration findings
        run: trivy config --format json --output security-config.json .
      - name: Build runtime images
        run: |
          docker build -f apps/web/Dockerfile -t citypulse-web:security .
          docker build -f services/api/Dockerfile -t citypulse-api:security .
          docker build -f services/ai-engine/Dockerfile -t citypulse-ai:security .
      - name: Scan runtime images for fixable high and critical vulnerabilities
        run: |
          failed=0
          for service in web api ai; do
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json --output "security-$service.json" "citypulse-$service:security" || failed=1
          done
          exit "$failed"
      - name: Generate CycloneDX software bills of materials
        run: |
          for service in web api ai; do
            trivy image --format cyclonedx --output "sbom-$service.cdx.json" "citypulse-$service:security"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-image-and-config-results
          path: |
            security-*.json
            sbom-*.cdx.json
